name: Auto Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Tag and release each new commit
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail

          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || \
             ! git merge-base --is-ancestor "$BEFORE" "$AFTER" 2>/dev/null; then
            COMMITS="$AFTER"
          else
            COMMITS=$(git rev-list --reverse "$BEFORE..$AFTER")
          fi

          for sha in $COMMITS; do
            VERSION=$(git show "$sha:backend/pyproject.toml" | grep -E '^version = "' | head -1 | sed -E 's/version = "(.*)"/\1/')
            if [ -z "$VERSION" ]; then
              echo "No version at $sha, skipping"
              continue
            fi

            TAG="v$VERSION"
            if git rev-parse "$TAG" >/dev/null 2>&1; then
              echo "Tag $TAG already exists, skipping"
              continue
            fi

            git tag "$TAG" "$sha"
            git push origin "$TAG"

            MSG=$(git log -1 --format=%B "$sha" | sed -E '1s/^\[v[0-9]+\.[0-9]+\.[0-9]+\]\s*//')

            PATCH=$(echo "$VERSION" | cut -d. -f3)
            if [ "$PATCH" = "0" ]; then
              gh release create "$TAG" --title "$TAG" --notes "$MSG" --latest
            else
              gh release create "$TAG" --title "$TAG" --notes "$MSG" --prerelease
            fi
          done
